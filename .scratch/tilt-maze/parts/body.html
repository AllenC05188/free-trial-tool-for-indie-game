  <div id="app">

    <!-- 20% — standing information. Deliberately quiet: it reports, it never
         competes with the thing the player is actually doing. -->
    <header class="hud-top">
      <div class="hud-id">
        <h1>思想重力場</h1>
        <div class="subtitle">TILT MAZE · 大師觀測終端</div>
      </div>
      <div class="hud-clock">
        <div class="doom-label"><span id="clockLabel">頓悟窗口</span><span id="clockRight">— —</span></div>
        <div class="doom-track">
          <div class="doom-fill" id="clockFill"></div>
        </div>
      </div>
      <div class="influence-box">
        <div class="label" id="scoreLabel">影響力指數</div>
        <div class="num" id="influenceNum">0</div>
      </div>
    </header>

    <!-- 70% — the act itself. On a 1080p screen this is everything between the
         thin top bar and the thin bottom strip. -->
    <main class="hero" id="heroRow">

      <!-- who this is happening to. Stays on screen during play, reacting, so
           the maze never reads as a detached mini-game. -->
      <aside class="who" id="whoPane">
        <canvas id="whoFx" class="who-fx"></canvas>
        <canvas id="npcTok" class="who-bust"></canvas>
        <div class="who-name" id="whoName">&nbsp;</div>
        <div class="who-tag" id="bubbleTag">教授派</div>
        <div class="who-say" id="bubbleText"></div>
        <div class="who-state" id="whoState"></div>
      </aside>

      <section class="field">
        <div class="arena-board" id="arenaBoard">
          <canvas id="arena"></canvas>
        </div>
        <div class="arena-cap" id="arenaCap"></div>
      </section>

      <!-- the master's own side of the performance -->
      <aside class="me" id="mePane">
        <canvas id="meFx" class="who-fx"></canvas>
        <canvas id="playerTok" class="who-bust"></canvas>
        <div class="who-name">大師</div>
        <div class="who-state" id="meState">觀測中</div>
      </aside>
    </main>

    <div class="hud-pad">
      <div class="dpad">
        <button id="dUp" disabled title="北傾">▲</button>
        <button id="dLeft" disabled title="西傾">◀</button>
        <div id="dCenter">傾斜</div>
        <button id="dRight" disabled title="東傾">▶</button>
        <button id="dDown" disabled title="南傾">▼</button>
      </div>
      <div class="footer-hint" id="footerHint">按住方向鍵持續傾斜，放開後場地回正</div>
    </div>

    <!-- 10% — the world reacting. Low contrast on purpose. -->
    <footer class="hud-bottom">
      <div class="panel-card" id="factionCard">
        <div class="pc-head"><span class="term-title">各學派信任度</span></div>
        <div class="factions" id="factionsPanel"></div>
      </div>
      <div class="panel-card" id="newsCard">
        <div class="pc-head"><span class="ticker-live"></span><span class="term-title">協會新聞線</span></div>
        <div class="news-list" id="newsList"></div>
      </div>
      <div class="ticker-wrap">
        <div class="ticker-label"><span class="ticker-live"></span>協會新聞線</div>
        <div class="ticker-track" id="tickerTrack">世界正在等待大師傾斜第一次……</div>
      </div>
    </footer>

  </div>

  <div class="flash" id="flash"></div>

  <!-- interpretation theater (ported) -->
  <div id="overlay">
    <div class="theater term" id="theater">
      <div class="theater-scroll">
        <div class="npc-name" id="theaterName">&nbsp;</div>
        <div class="char-stage">
          <canvas id="mainSprite" class="main-sprite"></canvas>
          <canvas id="iconSprite" class="icon-canvas hidden-el"></canvas>
        </div>
        <div class="caption" id="theaterCaption"></div>
        <div class="quote hidden-el" id="theaterQuote"></div>
        <div class="gain hidden-el" id="theaterGain">+0</div>
        <div id="viralTag" style="display:none" class="viral-tag">🔥 迷因病毒式擴散！</div>
        <button id="continueBtn" class="hidden-el">繼續</button>
      </div>
    </div>
  </div>

  <!-- arcade game-over report (endless mode only) -->
  <div id="reportOverlay">
    <div class="report term">
      <div class="report-head">GAME OVER</div>
      <canvas id="reportCard"></canvas>
      <div class="report-btns">
        <button id="againBtn" class="primary">再挑戰一次</button>
        <button id="shotBtn">存成圖片</button>
        <button id="copyBtn">複製戰績</button>
        <button id="quitBtn">回到街上</button>
      </div>
      <div class="report-note" id="reportNote"></div>
    </div>
  </div>

  <div id="startScreen">
    <div class="start-inner term">
      <div class="start-title">思想重力場</div>
      <div class="start-sub">TILT MAZE — 協會傾斜實驗艙 · 原型</div>
      <button class="primary" id="storyBtn">劇情模式</button>
      <button id="endlessBtn">無限模式</button>
      <div class="start-note">方向鍵／WASD／下方按鈕：按住傾斜場地。<br>球必須自己滾進洞裡——你不能碰它。<br>球只認得同色的洞，其他洞對它來說只是地板。</div>
    </div>
  </div>
