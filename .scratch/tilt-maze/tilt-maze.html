<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tilt Maze · 思想重力場 原型</title>
  <style>
/* ===================================================================
   PORTED FROM index.html — do not hand-edit here, edit the game and
   re-run build.js. This is the shared visual identity.
   =================================================================== */
    :root {
      /* every font-size in this sheet is multiplied by --fs, so the accessibility
       setting scales the whole interface consistently */
      --fs: 1;
      /* Observation-terminal shell — see docs/visual-identity.md.
       The chrome is a single phosphor channel; only *data* carries colour. */
      --bg-void: #060a08;
      --bg-panel: #0b1410;
      --bg-panel-2: #12201a;
      --border: #1e3b2c;
      --text: #d8ffe8;
      --text-dim: #5f9c78;
      --term-fg: #7ef0a8;
      --glow: 0 0 8px rgba(126, 240, 168, 0.45);
      --gold: #ffd23f;
      --cyan: #3fe6e0;
      --religion: #ffcf56;
      --merchant: #ff8c42;
      --ai: #b98bff;
      --netizen: #ff2e88;
      --military: #8fae5a;
      --awakened: #5f7cff;
      --danger: #ff5f56;
      --mono: ui-monospace, "SFMono-Regular", Consolas, "Courier New", monospace;
      --sans: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-void);
      color: var(--text);
      font-family: var(--sans);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 14px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(126, 240, 168, 0.10), transparent 60%),
        radial-gradient(ellipse at 50% 110%, rgba(63, 230, 224, 0.06), transparent 55%),
        var(--bg-void);
    }

    /* The whole application sits behind one CRT layer — this is what binds every
     screen into a single device rather than a set of menus. */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
      background:
        repeating-linear-gradient(0deg, rgba(126, 240, 168, 0.045) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    #app {
      width: 100%;
      max-width: 620px;
    }

    /* ---------- THREE-COLUMN LAYOUT ----------
     Narrow screens stack; wide screens push standing information out to the
     sides so the middle column is free to be the stage. */

    .panel-card {
      border: 2px solid var(--border);
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-card.grow {
      flex: 1;
      min-height: 0;
    }

    .pc-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel-2);
      font-family: var(--mono);
      font-size: calc(13px * var(--fs));
      letter-spacing: 1px;
      color: var(--term-fg);
      text-shadow: var(--glow);
    }

    .pc-link {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      padding: 3px 7px;
      cursor: pointer;
      white-space: nowrap;
    }

    .pc-link:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    .pc-body {
      padding: 9px 10px;
    }

    .panel-card .factions {
      border: none;
      margin: 0;
      background: none;
      padding: 8px;
    }

    .news-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      max-height: 280px;
    }

    .news-item {
      font-size: calc(14px * var(--fs));
      line-height: 1.6;
      padding: 7px 0;
      border-bottom: 1px dashed var(--border);
      color: var(--text-dim);
    }

    .news-item:first-child {
      color: var(--gold);
    }

    .news-item .nt {
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      color: var(--text-dim);
      opacity: 0.7;
      display: block;
    }


    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    h1 {
      font-family: var(--mono);
      font-size: calc(clamp(20px, 5vw, 28px) * var(--fs));
      letter-spacing: 2px;
      margin: 0;
      color: var(--text);
      color: var(--term-fg);
      text-shadow: var(--glow), 0 0 22px rgba(126, 240, 168, 0.3);
    }

    .subtitle {
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .influence-box {
      text-align: right;
      font-family: var(--mono);
    }

    .influence-box .label {
      font-size: calc(12px * var(--fs));
      letter-spacing: 2px;
      color: var(--text-dim);
    }

    .influence-box .num {
      font-size: calc(clamp(22px, 6vw, 30px) * var(--fs));
      color: var(--gold);
      text-shadow: 0 0 12px rgba(255, 210, 63, 0.7);
      font-weight: bold;
      font-family: var(--mono);
    }

    .doom-wrap {
      margin-bottom: 10px;
      font-family: var(--mono);
    }

    .doom-label {
      display: flex;
      justify-content: space-between;
      font-size: calc(13px * var(--fs));
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .doom-track {
      height: 14px;
      background: #000;
      border: 2px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .doom-fill {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(90deg, var(--danger) 0 8px, #a33b34 8px 16px);
      transition: width .6s ease;
    }

    .factions {
      display: grid;
      grid-template-columns: repeat(var(--fcols, 5), 1fr);
      gap: 6px;
      background: var(--bg-panel);
      border: 2px solid var(--border);
      padding: 8px;
      margin-bottom: 10px;
    }

    .faction {
      text-align: center;
      font-family: var(--mono);
    }

    .faction .icon {
      font-size: calc(16px * var(--fs));
    }

    .faction .name {
      font-size: calc(12px * var(--fs));
      color: var(--text-dim);
      letter-spacing: 0.5px;
      margin: 2px 0;
    }

    .faction .track {
      height: 8px;
      background: #000;
      border: 1px solid var(--border);
    }

    .faction .fill {
      height: 100%;
      width: 0%;
      transition: width .5s ease;
    }

    .faction .pct {
      font-size: calc(12px * var(--fs));
      margin-top: 2px;
      color: var(--text-dim);
    }

    .faction .hint {
      font-size: calc(12px * var(--fs));
      color: var(--text-dim);
      opacity: 0;
      height: 0;
      overflow: hidden;
      transition: opacity .3s;
    }

    .factions.revealed .hint {
      opacity: 0.85;
      height: auto;
      margin-top: 2px;
    }


    .stage {
      position: relative;
      height: 220px;
      border: 3px solid var(--border);
      overflow: hidden;
      background: linear-gradient(to bottom, #07110c 0%, #07110c 58%, #0e1d16 58%, #0e1d16 100%);
      margin-bottom: 10px;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      opacity: 0.6;
      animation: twinkle 2.4s ease-in-out infinite;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.15;
      }

      50% {
        opacity: 0.9;
      }
    }

    .building {
      position: absolute;
      bottom: 42%;
      background: #0a1610;
      border-top: 2px solid #172c20;
    }

    .road {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 42%;
      background: #050b08;
    }

    .road::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background: repeating-linear-gradient(90deg, #1e3b2c 0 18px, transparent 18px 34px);
    }

    .token {
      position: absolute;
      bottom: 14%;
      transition: left 1s ease;
      transform: translateX(-50%);
      filter: drop-shadow(0 4px 2px rgba(0, 0, 0, 0.5));
      animation: bob 1.8s ease-in-out infinite;
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateX(-50%) translateY(0);
      }

      50% {
        transform: translateX(-50%) translateY(-3px);
      }
    }

    #playerTok {
      left: 5%;
      z-index: 3;
    }

    #npcTok {
      left: 55%;
      opacity: 0;
      z-index: 2;
    }

    .bubble {
      position: absolute;
      bottom: calc(14% + 108px);
      left: 55%;
      transform: translateX(-50%);
      background: var(--bg-panel-2);
      border: 2px solid var(--border);
      padding: 8px 10px;
      max-width: 78%;
      font-size: calc(12px * var(--fs));
      line-height: 1.6;
      opacity: 0;
      transition: opacity .3s;
      z-index: 4;
    }

    .bubble .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      padding: 1px 5px;
      margin-bottom: 4px;
      border: 1px solid currentColor;
      letter-spacing: 1px;
    }

    .bubble::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--border);
    }

    .stage-hint {
      position: absolute;
      top: 6px;
      left: 8px;
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      color: var(--text-dim);
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 6px;
      z-index: 5;
    }

    .dpad-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .dpad {
      display: grid;
      grid-template-columns: 70px 70px 70px;
      grid-template-rows: 70px 70px 70px;
      gap: 5px;
    }

    .dpad button {
      font-family: var(--mono);
      font-size: calc(19px * var(--fs));
      background: var(--bg-panel);
      border: 2px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: transform .1s, background .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      line-height: 1;
    }

    .dpad .dk {
      font-size: calc(12px * var(--fs));
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .dpad button:not(:disabled):hover .dk {
      color: var(--gold);
    }

    .dpad button:active {
      transform: scale(0.92);
    }

    .dpad button:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .dpad button:not(:disabled):hover {
      background: var(--bg-panel-2);
      border-color: var(--gold);
    }

    #dUp {
      grid-column: 2;
      grid-row: 1;
    }

    #dLeft {
      grid-column: 1;
      grid-row: 2;
    }

    #dCenter {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(13px * var(--fs));
      color: var(--text-dim);
      border: none;
      background: none;
    }

    #dRight {
      grid-column: 3;
      grid-row: 2;
    }

    #dDown {
      grid-column: 2;
      grid-row: 3;
    }

    .ticker-wrap {
      border: 2px solid var(--border);
      background: #000;
      height: 26px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .ticker-label {
      background: var(--netizen);
      color: #000;
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      font-weight: bold;
      padding: 0 8px;
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      letter-spacing: 1px;
      z-index: 2;
    }

    .ticker-track {
      white-space: nowrap;
      font-family: var(--mono);
      font-size: calc(13px * var(--fs));
      color: var(--gold);
      padding-left: 100%;
    }

    @keyframes scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-100%);
      }
    }

    .footer-hint {
      text-align: center;
      font-size: calc(12px * var(--fs));
      color: var(--text-dim);
      font-family: var(--mono);
      letter-spacing: 0.5px;
    }


    /* ---------- OVERLAY (interpretation theater) ---------- */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 0, 10, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    #overlay.active {
      display: flex;
    }

    .flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
    }

    .flash.go {
      animation: flashpop .35s ease-out;
    }

    @keyframes flashpop {
      0% {
        opacity: 0.85;
      }

      100% {
        opacity: 0;
      }
    }

    /* A record can be long. Cap the panel to the window and scroll the body, so
     the continue button can never be pushed off-screen and strand the player. */
    .theater {
      max-width: 460px;
      width: 100%;
      background: var(--bg-panel);
      border: 2px solid var(--border);
      padding: 18px;
      text-align: center;
      transform: scale(0.8);
      opacity: 0;
      animation: zoomin .3s ease-out forwards;
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .theater-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    @keyframes zoomin {
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .theater.shake {
      animation: zoomin .3s ease-out forwards, shake .4s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-6px);
      }

      40% {
        transform: translateX(6px);
      }

      60% {
        transform: translateX(-4px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    .char-stage {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 8px;
    }

    .char-stage canvas.main-sprite {
      transition: opacity .2s;
      max-width: 100%;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
    }

    .icon-canvas {
      position: absolute;
      top: 2px;
      right: calc(50% - 130px);
      z-index: 2;
    }

    .theater .npc-name {
      font-family: var(--mono);
      font-size: calc(13px * var(--fs));
      color: var(--text-dim);
      letter-spacing: 1px;
      min-height: 14px;
    }

    .theater .caption {
      font-size: calc(14px * var(--fs));
      line-height: 1.7;
      margin: 8px 0;
      min-height: 44px;
      color: var(--text);
    }

    .theater .quote {
      font-size: calc(14px * var(--fs));
      line-height: 1.85;
      margin: 10px 0;
      text-align: left;
    }

    .theater .gain {
      font-family: var(--mono);
      font-size: calc(26px * var(--fs));
      color: var(--gold);
      font-weight: bold;
      text-shadow: 0 0 14px rgba(255, 210, 63, 0.7);
    }

    .theater .viral-tag {
      display: inline-block;
      margin-top: 6px;
      font-family: var(--mono);
      font-size: calc(13px * var(--fs));
      background: var(--netizen);
      color: #000;
      padding: 2px 8px;
      letter-spacing: 1px;
    }

    .theater button {
      flex-shrink: 0;
      width: 100%;
      margin-top: 14px;
      background: none;
      border: 2px solid var(--term-fg);
      color: var(--term-fg);
      text-shadow: var(--glow);
      font-family: var(--mono);
      font-size: calc(13px * var(--fs));
      padding: 10px 22px;
      cursor: pointer;
      letter-spacing: 2px;
    }

    .theater button:hover {
      background: rgba(126, 240, 168, 0.14);
    }

    .hidden-el {
      display: none !important;
    }

    .ticker-wrap {
      height: 30px;
    }

    .ticker-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      margin-right: 6px;
      flex-shrink: 0;
      animation: livepulse 1.2s ease-in-out infinite;
    }

    @keyframes livepulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.25;
      }
    }


    .term-title {
      font-family: var(--mono);
      letter-spacing: 2px;
      color: var(--term-fg);
      text-shadow: var(--glow);
    }

    .term-title::before {
      content: '▚ ';
      opacity: 0.8;
    }


    .rec {
      text-align: left;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.32);
      padding: 0 0 12px;
      font-family: var(--sans);
    }

    .rec-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 210, 63, 0.07);
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      color: var(--gold);
      letter-spacing: 1px;
    }

    .rec-top .rt {
      color: var(--text-dim);
    }

    .rec-by {
      padding: 8px 12px 0;
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      color: var(--text-dim);
    }

    .rec-sec {
      margin: 11px 12px 5px;
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      color: var(--text-dim);
      letter-spacing: 1px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 3px;
    }

    .rec-sec::before {
      content: '── ';
      opacity: 0.6;
    }

    .rec-raw {
      margin: 0 12px;
      font-family: var(--mono);
      font-size: calc(12.5px * var(--fs));
      line-height: 1.85;
      color: var(--cyan);
    }

    .rec-body {
      margin: 0 12px;
      font-size: calc(13.5px * var(--fs));
      line-height: 1.9;
    }

    .rec-foot {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 12px 12px 0;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      color: var(--text-dim);
    }

    .rec-foot b {
      font-size: calc(21px * var(--fs));
      color: var(--gold);
      text-shadow: 0 0 12px rgba(255, 210, 63, 0.6);
    }

    .rec-note {
      margin: 9px 12px 0;
      font-family: var(--mono);
      font-size: calc(12px * var(--fs));
      color: var(--netizen);
      line-height: 1.6;
    }

/* ===================================================================
   NEW — Tilt Maze
   =================================================================== */
/* ---------- THE FIELD ----------
   The tray, its walls and the tilt all live inside the canvas as real 3D — see
   the projection in game.js. Nothing about the tilt is written down as a number
   anywhere on screen: you read it off the tray and off the ball's shadow. */
.arena-wrap {
  display: none;
  padding: 6px 0 2px;
  margin-bottom: 10px;
}

.arena-wrap.on {
  display: block;
}

/* the depth is projected inside the canvas, so the element itself stays flat —
   only the glow bleeds out of it */
.arena-board {
  display: flex;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 55%, rgba(80, 150, 200, 0.10), transparent 70%);
}

.arena-board canvas {
  display: block;
  filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.85));
}

.arena-cap {
  text-align: center;
  font-family: var(--mono);
  font-size: calc(12px * var(--fs));
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-top: 10px;
  min-height: 1.4em;
}

.arena-cap.warn {
  color: var(--danger);
}

/* the stage collapses out of the way once the field opens, so the two never
   fight for the same vertical space on a phone */
.stage.tucked {
  height: 92px;
}

.stage.gone {
  display: none;
}

/* ---------- COUNTDOWN ---------- */
.doom-fill.calm {
  background: linear-gradient(90deg, var(--term-fg), var(--cyan));
}

/* ---------- GAME OVER REPORT (arcade) ---------- */
#reportOverlay {
  position: fixed;
  inset: 0;
  background: rgba(3, 8, 5, 0.94);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 120;
  padding: 14px;
}

#reportOverlay.active {
  display: flex;
}

.report {
  width: 100%;
  max-width: 460px;
  background: var(--bg-panel);
  border: 3px solid var(--border);
  padding: 14px;
  text-align: center;
  animation: zoomin .28s ease-out forwards;
}

.report-head {
  font-family: var(--mono);
  font-size: calc(26px * var(--fs));

      /* ================= CANVAS DRAWING ================= */
      function drawGrid(canvas, rows, palette, cell) {
        canvas.width = rows[0].length * cell;
        canvas.height = rows.length * cell;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < rows.length; y++) {
          const row = rows[y];
          for (let x = 0; x < row.length; x++) {
            const ch = row[x];
            if (ch === ' ') continue;
            ctx.fillStyle = palette[ch] || '#ff00ff';
            ctx.fillRect(x * cell, y * cell, cell, cell);
          }
        }
      }

      function playerRows(dir) {
        const base = PLAYER_BASE.map(r => r.split(''));
        const eye = EYE_BY_DIR[dir] || EYE_BY_DIR.neutral;
        for (let dy = 0; dy < eye.length; dy++) {
          for (let dx = 0; dx < eye[dy].length; dx++) {
            const ch = eye[dy][dx];
            if (ch !== ' ') base[EYE_R0 + dy][EYE_C0 + dx] = ch;
          }
        }
        return base.map(r => r.join(''));
      }

      function drawPlayer(canvas, dir, cell) { drawGrid(canvas, playerRows(dir), PLAYER_PALETTE, cell); }
      function drawNPC(canvas, faction, cell) { const d = NPC_DEFS[faction]; drawGrid(canvas, d.grid, d.palette, cell); }

      /* ================= PORTRAIT LAYER (presentation) =================
         Two-layer character presentation:
           - the small grids above are the *gameplay* layer (position and facing)
           - this is the *presentation* layer: a real pixel-art bust that acts.
    
         This is an honest pixel pipeline, not vector shapes on a canvas:
           1. everything is drawn into a fixed 96x112 logical PIXEL BUFFER of
              palette keys — one array slot is exactly one art pixel
           2. head angle is a per-row integer SHEAR (how pixel artists rotate),
              never ctx.rotate(), which is what smears the grid
           3. the buffer gets a contour pass, then is blitted through ImageData and
              scaled with nearest-neighbour, so every pixel stays square and crisp
           4. breathing is quantised into 8 cached frames per pose — a real sprite
              animation, and cheap enough to run many portraits at once
    
         A pose is a set of values (gaze, brow, mouth, tilt, lift, breath), so the
         four D-pad directions are four different performances, not one image moved.
         Swapping in hand-drawn art later means replacing buildPortrait() only. */

      const PORT = { W: 96, H: 112 };

      const PORTRAIT_DEFS = {
        player: { skin: '#f2c79c', hair: '#5b34a0', cloth: '#2c1a52', eye: '#6ff0e8', accent: '#ffd23f', style: 'swept', acc: 'none' },

        military: { skin: '#daab7e', hair: '#4c4f36', cloth: '#526640', eye: '#c9a227', accent: '#c9a227', style: 'buzz', acc: 'cap' },

        rival: { skin: '#eeba96', hair: '#ff4d4d', cloth: '#421725', eye: '#ff4d4d', accent: '#ff4d4d', style: 'spike', acc: 'none' },

      /* Colour ramps: pixel art reads by having few, deliberate steps. */
      function shiftHex(hex, amt) {
        const n = parseInt(hex.slice(1), 16);
        const cl = v => Math.max(0, Math.min(255, v));
        const r = cl(((n >> 16) & 255) + amt), g = cl(((n >> 8) & 255) + amt), b = cl((n & 255) + amt);
        return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
      }
      const PAL_CACHE = {};
      function palOf(key) {
        if (PAL_CACHE[key]) return PAL_CACHE[key];
        const d = PORTRAIT_DEFS[key] || PORTRAIT_DEFS.player;
        const p = {
          OL: '#100a16',
          S3: shiftHex(d.skin, 26), S2: d.skin, S1: shiftHex(d.skin, -34), S0: shiftHex(d.skin, -68),
          H2: shiftHex(d.hair, 30), H1: d.hair, H0: shiftHex(d.hair, -46),
          C2: shiftHex(d.cloth, 28), C1: d.cloth, C0: shiftHex(d.cloth, -32),
          EW: '#f6f2ec', EG: '#cfc4d4', EI: d.eye, EP: '#170f22', AC: d.accent, WH: '#ffffff',
          M1: '#7a3542', M0: '#48202b', T: '#f6ecd8'
        };

      function pset(b, x, y, c) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= b.w || y >= b.h) return; b.d[y * b.w + x] = c; }
      function pgetp(b, x, y) { if (x < 0 || y < 0 || x >= b.w || y >= b.h) return null; return b.d[y * b.w + x]; }
      function phline(b, x0, x1, y, c) { x0 |= 0; x1 |= 0; for (let x = x0; x <= x1; x++) pset(b, x, y, c); }
      function prect(b, x, y, w, h, c) { for (let j = 0; j < h; j++) phline(b, x, x + w - 1, y + j, c); }
      function pellipse(b, cx, cy, rx, ry, c, y0, y1) {
        for (let dy = -ry; dy <= ry; dy++) {
          const yy = cy + dy;
          if (y0 !== undefined && yy < y0) continue;
          if (y1 !== undefined && yy > y1) continue;
          const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
          if (w > 0) phline(b, cx - w, cx + w - 1, yy, c);
        }
      }
      /* 2x2 checker dither between two ramp steps — classic pixel shading */
      function pdither(b, x, y, w, h, c, phase) {
        for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)
          if (((x + i) + (y + j) + (phase || 0)) % 2 === 0) pset(b, x + i, y + j, c);
      }
      /* contour pass: one dark pixel around every filled edge, the thing that
         makes pixel art read as pixel art */
      function pcontour(b, c) {
        const src = b.d.slice();
        const at = (x, y) => (x < 0 || y < 0 || x >= b.w || y >= b.h) ? null : src[y * b.w + x];
        for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
          if (src[y * b.w + x] !== null) continue;
          if (at(x, y - 1) || at(x, y + 1) || at(x - 1, y) || at(x + 1, y)) b.d[y * b.w + x] = c;
        }
      }
      /* how pixel artists tilt a head: shift whole rows by integer amounts */
      function pblitShear(dst, src, dx, dy, k, pivot) {
        for (let y = 0; y < src.h; y++) {
          const off = Math.round((y - pivot) * k);
          for (let x = 0; x < src.w; x++) {
            const v = src.d[y * src.w + x];
            if (v !== null) pset(dst, dx + x + off, dy + y, v);
          }
        }
      }

      const POSES = {
        neutral: { gaze: [0, 0], brow: 'flat', mouth: 'rest', tilt: 0.00, lift: 0, breath: { amp: 1.0, rate: 1.00 }, spark: 0 },
        // the four ways of thinking, one per D-pad direction
        up: { gaze: [0, -3], brow: 'raise', mouth: 'part', tilt: -0.07, lift: -4, breath: { amp: 2.0, rate: 0.60 }, spark: 0 },
        left: { gaze: [-4, -1], brow: 'furrow', mouth: 'tight', tilt: 0.09, lift: 0, breath: { amp: 0.8, rate: 0.70 }, spark: 0 },
        right: { gaze: [4, -1], brow: 'raise', mouth: 'firm', tilt: -0.04, lift: -2, breath: { amp: 1.4, rate: 1.40 }, spark: 1 },
        down: { gaze: [0, 3], brow: 'furrow', mouth: 'rest', tilt: 0.03, lift: 4, breath: { amp: 0.7, rate: 0.65 }, spark: 0 },
        // reaction beats for the NPC side of the performance
        think: { gaze: [-2, 2], brow: 'furrow', mouth: 'tight', tilt: 0.10, lift: 2, breath: { amp: 0.9, rate: 0.80 }, spark: 0 },
        realize: { gaze: [0, -1], brow: 'raise', mouth: 'gape', tilt: -0.02, lift: -3, breath: { amp: 2.8, rate: 2.10 }, spark: 2 },
        awe: { gaze: [0, -2], brow: 'raise', mouth: 'part', tilt: 0.00, lift: -2, breath: { amp: 1.8, rate: 0.90 }, spark: 1 },
        rattled: { gaze: [3, 2], brow: 'sad', mouth: 'gape', tilt: 0.12, lift: 2, breath: { amp: 2.4, rate: 2.40 }, spark: 0 }
      };

      const FRAMES = 8;   // breathing cycle length, in cached sprite frames

      /* ---- the head, drawn into its own buffer so it can be sheared as a unit ---- */
      function buildHead(defKey, p, bob) {
        const d = PORTRAIT_DEFS[defKey] || PORTRAIT_DEFS.player;
        const h = PB(60, 68);
        const cx = 30, cy = 32;

        // skull: base, then two shading steps and a dithered transition
        pellipse(h, cx, cy, 21, 25, 'S2');
        pellipse(h, cx + 7, cy + 2, 15, 22, 'S1', cy - 16, cy + 24);
        pdither(h, cx + 2, cy - 14, 8, 34, 'S1', 0);
        pellipse(h, cx - 6, cy - 4, 11, 15, 'S3', cy - 18, cy + 2);
        pdither(h, cx - 1, cy - 16, 7, 22, 'S3', 1);
        // jaw shadow
        pellipse(h, cx, cy + 16, 13, 7, 'S1', cy + 18, cy + 24);
        // ears
        prect(h, cx - 23, cy - 1, 3, 8, 'S1'); prect(h, cx + 20, cy - 1, 3, 8, 'S1');
        prect(h, cx - 22, cy + 1, 1, 4, 'S0'); prect(h, cx + 21, cy + 1, 1, 4, 'S0');

        buildHair(h, d, cx, cy, bob);

        // ---- brows ----
        const bw = 10;
        let by = cy - 11;
        if (p.brow === 'raise') by -= 3;
        if (p.brow === 'furrow') by += 2;
        [[-14, -1], [5, 1]].forEach(([bx, side]) => {
          for (let i = 0; i < bw; i++) {
            let step = 0;
            if (p.brow === 'furrow') step = Math.round(side * (i / (bw - 1) - 0.5) * 3.4);
            if (p.brow === 'sad') step = Math.round(-side * (i / (bw - 1) - 0.5) * 3.4);
            if (p.brow === 'raise') step = Math.round(Math.sin(i / (bw - 1) * Math.PI) * -1.2);
            prect(h, cx + bx + i, by + step, 1, 3, 'H0');
          }
        });

        // ---- eyes ----
        const eyeY = cy - 4;
        const [gx, gy] = p.gaze;
        [-14, 5].forEach(ex => {
          prect(h, cx + ex, eyeY, 9, 7, 'EW');
          prect(h, cx + ex, eyeY, 9, 1, 'S0');            // socket depth
          prect(h, cx + ex, eyeY + 1, 9, 1, 'EG');
          prect(h, cx + ex, eyeY + 6, 9, 1, 'S1');          // lower lid
          const ix = cx + ex + 3 + Math.max(-3, Math.min(3, gx));
          const iy = eyeY + 2 + Math.max(-1, Math.min(2, gy));
          prect(h, ix, iy, 4, 4, 'EI');
          prect(h, ix + 1, iy + 1, 2, 2, 'EP');
          pset(h, ix, iy, 'WH');                        // catchlight
          if (p.spark > 0) { pset(h, ix + 3, iy, 'WH'); pset(h, ix + 3, iy + 1, 'WH'); }
          // lashes
          prect(h, cx + ex - 1, eyeY, 1, 2, 'H0'); prect(h, cx + ex + 9, eyeY, 1, 2, 'H0');
        });

        // ---- nose ----
        const nx = cx - 1 + Math.round(gx * 0.3);
        prect(h, nx, cy + 3, 2, 6, 'S1');
        prect(h, nx - 1, cy + 8, 1, 2, 'S0');
        prect(h, nx + 2, cy + 8, 1, 2, 'S0');
        pset(h, nx, cy + 3, 'S3');

        // ---- mouth ----
        const my = cy + 14;
        switch (p.mouth) {
          case 'rest': prect(h, cx - 5, my, 10, 1, 'M0'); prect(h, cx - 4, my + 1, 8, 1, 'S1'); break;
          case 'tight': prect(h, cx - 5, my, 10, 1, 'M0'); pset(h, cx - 6, my - 1, 'M0'); pset(h, cx + 5, my - 1, 'M0');
            prect(h, cx - 4, my + 1, 8, 1, 'S1'); break;
          case 'firm': prect(h, cx - 7, my, 14, 1, 'M0'); pset(h, cx - 8, my - 1, 'M0'); pset(h, cx + 7, my - 1, 'S1'); break;
          case 'part': prect(h, cx - 5, my - 1, 10, 4, 'M0'); prect(h, cx - 4, my, 8, 2, 'M1');
            prect(h, cx - 4, my - 1, 8, 1, 'T'); break;
          case 'gape': pellipse(h, cx, my + 2, 7, 7, 'M0'); pellipse(h, cx, my + 3, 5, 5, 'M1');
            prect(h, cx - 5, my - 3, 10, 2, 'T'); break;
        }

        buildAccessory(h, d, cx, cy, eyeY, p);
        return h;
      }

      function buildHair(h, d, cx, cy, bob) {
        const s = Math.round(bob * 0.5);
        switch (d.style) {
          case 'short':
            pellipse(h, cx, cy - 4, 22, 21, 'H1', cy - 27, cy - 8);
            pellipse(h, cx - 5, cy - 10, 13, 11, 'H2', cy - 25, cy - 14);
            prect(h, cx - 23, cy - 11, 4, 12, 'H0'); prect(h, cx + 19, cy - 11, 4, 12, 'H0');
            pdither(h, cx - 20, cy - 10, 40, 4, 'H0', 0);
            break;
          case 'swept':
            pellipse(h, cx, cy - 5, 22, 22, 'H1', cy - 28, cy - 7);
            pellipse(h, cx - 4, cy - 12, 15, 12, 'H2', cy - 26, cy - 15);
            for (let i = 0; i < 16; i++) prect(h, cx - 21 + i + s, cy - 22 + Math.round(i * 0.42), 2, 5, 'H2');
            prect(h, cx - 24, cy - 12, 4, 16, 'H0'); prect(h, cx + 20, cy - 12, 4, 13, 'H0');
            break;
          case 'long':
            pellipse(h, cx, cy - 4, 22, 21, 'H1', cy - 27, cy - 7);
            pellipse(h, cx - 5, cy - 11, 13, 11, 'H2', cy - 25, cy - 15);
            prect(h, cx - 26 + s, cy - 13, 6, 38, 'H1'); prect(h, cx + 20 + s, cy - 13, 6, 38, 'H1');
            prect(h, cx - 26 + s, cy + 11, 6, 14, 'H0'); prect(h, cx + 20 + s, cy + 11, 6, 14, 'H0');
            pdither(h, cx - 25 + s, cy - 6, 4, 20, 'H2', 1);
            break;
          case 'slick':
            pellipse(h, cx, cy - 7, 21, 18, 'H1', cy - 25, cy - 9);
            for (let i = 0; i < 19; i++) prect(h, cx - 19 + i * 2, cy - 24 + Math.round(Math.abs(i - 9) * 0.5), 1, 14, i % 2 ? 'H2' : 'H0');
            prect(h, cx - 21, cy - 19, 42, 2, 'H0');
            break;
          case 'messy':
            pellipse(h, cx, cy - 5, 22, 21, 'H1', cy - 28, cy - 8);
            [[-19, -27], [-11, -31], [-2, -30], [7, -31], [16, -26]].forEach(([hx, hy], i) => {
              prect(h, cx + hx + (i % 2 ? s : -s), cy + hy, 4, 9, i % 2 ? 'H2' : 'H1');
            });
            prect(h, cx - 24, cy - 11, 5, 17, 'H0'); prect(h, cx + 19, cy - 11, 5, 17, 'H0');
            break;
          case 'spike':
            pellipse(h, cx, cy - 5, 21, 20, 'H1', cy - 26, cy - 8);
            [-17, -9, -1, 7, 14].forEach((hx, i) => {
              const hh = 10 + (i % 2) * 6;
              prect(h, cx + hx + s, cy - 25 - hh + 6, 5, hh, i % 2 ? 'H2' : 'H1');
              prect(h, cx + hx + s, cy - 25 - hh + 6, 1, hh, 'H0');
            });
            break;
          case 'buzz':
            pellipse(h, cx, cy - 3, 21, 19, 'H0', cy - 25, cy - 9);
            pdither(h, cx - 19, cy - 24, 38, 15, 'H1', 0);
            break;
          case 'visor':
            pellipse(h, cx, cy - 5, 22, 21, 'H0', cy - 28, cy - 11);
            prect(h, cx - 22, cy - 27, 44, 4, 'H1');
            pdither(h, cx - 22, cy - 23, 44, 3, 'H2', 0);
            break;
        }
      }

      function buildAccessory(h, d, cx, cy, eyeY, p) {
        switch (d.acc) {
          case 'glasses':
            [[-16], [3]].forEach(([ox]) => {
              prect(h, cx + ox, eyeY - 2, 13, 1, 'AC'); prect(h, cx + ox, eyeY + 7, 13, 1, 'AC');
              prect(h, cx + ox, eyeY - 2, 1, 10, 'AC'); prect(h, cx + ox + 12, eyeY - 2, 1, 10, 'AC');
            });
            prect(h, cx - 4, eyeY + 1, 8, 1, 'AC');
            prect(h, cx - 23, eyeY - 1, 7, 1, 'AC'); prect(h, cx + 16, eyeY - 1, 7, 1, 'AC');
            pset(h, cx - 14, eyeY - 1, 'WH'); pset(h, cx + 5, eyeY - 1, 'WH');   // lens glint
            break;
          case 'visor':
            prect(h, cx - 21, eyeY - 3, 42, 11, 'AC');
            pdither(h, cx - 21, eyeY - 3, 42, 11, 'EP', 0);
            prect(h, cx - 21, eyeY - 4, 42, 1, 'H1');
            prect(h, cx - 18, eyeY - 1, 6, 1, 'WH');
            break;
          case 'hood':
            prect(h, cx - 26, cy - 19, 6, 34, 'C1'); prect(h, cx + 20, cy - 19, 6, 34, 'C1');
            prect(h, cx - 26, cy - 22, 52, 4, 'C0');
            pdither(h, cx - 26, cy - 19, 6, 30, 'C0', 0); pdither(h, cx + 20, cy - 19, 6, 30, 'C0', 1);
            break;
          case 'cap':
            prect(h, cx - 22, cy - 26, 44, 7, 'C1');
            pdither(h, cx - 22, cy - 26, 44, 4, 'C2', 0);
            prect(h, cx - 27, cy - 20, 54, 3, 'C0');
            prect(h, cx - 4, cy - 25, 8, 5, 'AC');
            break;
          case 'tie':
            prect(h, cx - 3, cy + 29, 6, 14, 'AC'); prect(h, cx - 4, cy + 26, 8, 4, 'AC');
            prect(h, cx - 3, cy + 29, 2, 14, 'WH');
            break;
          case 'halo':
            for (let i = 0; i < 36; i++) if (i % 3 !== 2) pset(h, cx - 18 + i, cy - 32, 'AC');
            break;
          case 'phone':
            prect(h, cx + 21, cy + 22, 9, 15, 'EP');
            prect(h, cx + 22, cy + 23, 7, 12, 'AC');
            prect(h, cx + 22, cy + 23, 7, 4, 'WH');
            break;
        }
      }

      function buildPortrait(defKey, poseKey, frame) {
        const p = POSES[poseKey] || POSES.neutral;
        const b = PB(PORT.W, PORT.H);
        const phase = (frame / FRAMES) * Math.PI * 2;
        const br = Math.sin(phase * p.breath.rate) * p.breath.amp;
        const bob = Math.sin(phase * p.breath.rate - 0.9) * p.breath.amp;
        const cx = 48;

        // ---- shoulders / torso ----
        const shY = 74 + Math.round(br * 0.5);
        pellipse(b, cx, shY + 22, 40, 30, 'C1', shY, PORT.H - 1);
        pellipse(b, cx + 10, shY + 24, 30, 28, 'C0', shY + 8, PORT.H - 1);
        pdither(b, cx - 4, shY + 2, 24, 36, 'C0', 0);
        pellipse(b, cx - 14, shY + 16, 14, 18, 'C2', shY + 4, shY + 26);
        pdither(b, cx - 20, shY + 4, 16, 22, 'C2', 1);
        prect(b, cx - 9, shY, 18, 6, 'C0');            // collar opening

        // ---- neck ----
        const neckY = 62 + p.lift + Math.round(br * 0.35);
        prect(b, cx - 8, neckY, 16, 16, 'S1');
        prect(b, cx - 6, neckY, 12, 13, 'S2');
        prect(b, cx - 8, neckY, 16, 3, 'S0');          // shadow under the jaw

        // ---- head, sheared as one unit ----
        const head = buildHead(defKey, p, bob);
        const headY = 6 + p.lift + Math.round(br * 0.4);
        pblitShear(b, head, cx - 30, headY, p.tilt, 60);

        pcontour(b, 'OL');

        // ---- the "it clicked" glint, drawn after the contour so it stays bright ----
        if (p.spark > 0 && (frame % FRAMES) < 5) {
          const sx = cx + 30, sy = headY + 8;
          for (let i = -5; i <= 5; i++) { pset(b, sx, sy + i, 'AC'); pset(b, sx + i, sy, 'AC'); }
          pset(b, sx, sy, 'WH');
          if (p.spark >= 2) {
            for (let i = -3; i <= 3; i++) { pset(b, sx - 14, sy + 18 + i, 'AC'); pset(b, sx - 14 + i, sy + 18, 'AC'); }
          }
        }
        return b;
      }

      /* ---- cache: one baked sprite frame per (character, pose, frame) ---- */
      const SPRITE_CACHE = {};
      function spriteFrame(defKey, poseKey, frame) {
        const key = defKey + '|' + poseKey + '|' + frame;
        if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
        const buf = buildPortrait(defKey, poseKey, frame);
        const pal = palOf(defKey);
        const off = document.createElement('canvas');
        off.width = buf.w; off.height = buf.h;
        const octx = off.getContext('2d');
        const img = octx.createImageData(buf.w, buf.h);
        for (let i = 0; i < buf.d.length; i++) {
          const k = buf.d[i];
          if (!k) continue;
          const hex = pal[k] || '#ff00ff';
          const n = parseInt(hex.slice(1), 16);
          img.data[i * 4] = (n >> 16) & 255;
          img.data[i * 4 + 1] = (n >> 8) & 255;
          img.data[i * 4 + 2] = n & 255;
          img.data[i * 4 + 3] = 255;
        }
        octx.putImageData(img, 0, 0);
        SPRITE_CACHE[key] = off;
        return off;
      }

      function drawPortrait(canvas, defKey, poseKey, t) {
        const scale = canvas._cell || 3;
        const frame = Math.floor(t) % FRAMES;
        if (canvas._lastKey === defKey + poseKey + frame + scale) return;   // nothing changed
        canvas._lastKey = defKey + poseKey + frame + scale;
        const spr = spriteFrame(defKey, poseKey, frame);
        canvas.width = PORT.W * scale; canvas.height = PORT.H * scale;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(spr, 0, 0, canvas.width, canvas.height);
      }

      const livePortraits = new Set();
      function setPortrait(canvas, defKey, poseKey, cell) {
        canvas._cell = cell || 3;
        canvas._def = defKey; canvas._pose = poseKey;
        if (!canvas._t0) canvas._t0 = performance.now();
        livePortraits.add(canvas);
        drawPortrait(canvas, defKey, poseKey, (performance.now() - canvas._t0) / 110);
      }
      function stopPortrait(canvas) { livePortraits.delete(canvas); }
      (function portraitLoop() {
        const now = performance.now();
        livePortraits.forEach(cv => {
          if (!cv.isConnected || cv.offsetParent === null) return;
          drawPortrait(cv, cv._def, cv._pose, (now - cv._t0) / 110);
        });
        requestAnimationFrame(portraitLoop);
      })();
      function drawIcon(canvas, which, cell) {
        if (which === 'think') drawGrid(canvas, ICON_THINK, ICON_PALETTE, cell);
        else drawGrid(canvas, ICON_BURST, ICON_PALETTE, cell);
      }

      function drawWorldScene(canvas, intense) {
        const W = 200, H = 92;
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, intense ? '#3a0712' : '#170a22');
        grad.addColorStop(0.55, intense ? '#6e1712' : '#3a1728');
        grad.addColorStop(1, intense ? '#c2481f' : '#82311f');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

        for (let i = 0; i < 26; i++) {
          ctx.fillStyle = Math.random() < 0.5 ? '#ffdca0' : '#ff8a4d';
          ctx.fillRect(Math.random() * W, Math.random() * H * 0.5, 1, 1);
        }

        const vx = W * 0.72, vBaseY = H * 0.62, vTopY = H * 0.16, vHalf = 28;
        ctx.fillStyle = '#170a12';
        ctx.beginPath(); ctx.moveTo(vx - vHalf, vBaseY); ctx.lineTo(vx, vTopY); ctx.lineTo(vx + vHalf, vBaseY); ctx.closePath(); ctx.fill();
        ctx.fillStyle = intense ? '#ff6a2e' : '#ff9a3f'; ctx.fillRect(vx - 4, vTopY - 2, 8, 4);
        ctx.fillStyle = '#ff4d1f'; ctx.fillRect(vx - 2, vTopY, 3, vBaseY - vTopY);
        if (intense) ctx.fillRect(vx + 6, vTopY + 8, 2, vBaseY - vTopY - 8);
        ctx.fillStyle = 'rgba(40,20,35,0.65)';
        for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(vx + Math.sin(i) * 6, vTopY - 6 - i * 7, 6 + i * 1.6, 0, Math.PI * 2); ctx.fill(); }

        ctx.fillStyle = '#0d0611'; ctx.fillRect(0, H * 0.72, W, H * 0.28);
        ctx.fillStyle = '#170a1e';
        [[6, 14], [22, 20], [40, 10], [58, 24], [100, 16], [120, 22], [140, 12], [164, 18]].forEach(([bx, bh]) => {
          ctx.fillRect(bx, H * 0.72 - bh, 10, bh);
          ctx.clearRect(bx + (Math.random() < 0.5 ? 0 : 6), H * 0.72 - bh, 4, 3);
        });

        ctx.strokeStyle = intense ? '#ff5a2a' : '#ff8a3f'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        let cx = 0, cy = H * 0.86; ctx.moveTo(cx, cy);
        while (cx < W) { cx += 10 + Math.random() * 8; cy += (Math.random() - 0.5) * 6; ctx.lineTo(cx, cy); }
        ctx.stroke();

        ctx.fillStyle = '#0a0512';
        for (let i = 0; i < 7; i++) {
          const fx = 10 + Math.random() * (W - 20), fy = H * 0.86 + Math.random() * 6;
          ctx.fillRect(fx, fy, 1, 3); ctx.fillRect(fx - 1, fy + 3, 3, 1);
        }
      }


      const META = {

/* Endless levels are BUILT solvable rather than generated-and-hoped-for: every
   ball and its matching hole are drawn from the same open region, so a walled-off
   pocket can never hold the thing you need. The check at the end is a backstop,
   not the mechanism. */
function genLevel(n) {
  const cols = clamp(11 + Math.floor(n / 3), 11, 17);
  const rows = clamp(7 + Math.floor(n / 4), 7, 11);
  const balls = n >= 6 ? 2 : 1;

  for (let attempt = 0; attempt < 80; attempt++) {
    const g = [];
    for (let y = 0; y < rows; y++) {
      let row = '';
      for (let x = 0; x < cols; x++) row += (x === 0 || y === 0 || x === cols - 1 || y === rows - 1) ? '#' : '.';
      g.push(row.split(''));
    }
    const put = (x, y, ch) => { if (g[y] && g[y][x] && g[y][x] === '.') { g[y][x] = ch; return true; } return false; };

    // walls: short bars rather than noise, so the room stays readable
    const bars = 1 + Math.min(5, Math.floor(n / 2));
    for (let i = 0; i < bars; i++) {
      const len = randInt(2, Math.min(5, cols - 4));
      const horiz = Math.random() < 0.5;
      const x = randInt(2, cols - 3), y = randInt(2, rows - 3);
      for (let k = 0; k < len; k++) put(horiz ? x + k : x, horiz ? y : y + k, '#');
    }
    // terrain patches
    if (n >= 3) for (let i = 0; i < 1 + Math.floor(n / 5); i++) {
      const ch = Math.random() < 0.55 ? 'I' : 'G';
      const w = randInt(2, 4), h = randInt(2, 3);
      const x = randInt(1, cols - 1 - w), y = randInt(1, rows - 1 - h);
      for (let j = 0; j < h; j++) for (let i2 = 0; i2 < w; i2++) put(x + i2, y + j, ch);
    }

    // Everything lands in ONE open region — the largest one — so no piece of the
    // puzzle can end up behind a wall the ball has no way through.
    const region = regionMap(g);
    const buckets = {};
    for (let y = 1; y < rows - 1; y++) for (let x = 1; x < cols - 1; x++) {
      const id = region[y][x];
      if (id < 0 || g[y][x] !== '.') continue;   // only plain floor is a legal spot
      (buckets[id] = buckets[id] || []).push([x, y]);
    }
    const home = Object.values(buckets).sort((a, b) => b.length - a.length)[0] || [];
    if (home.length < balls * 2 + 4) continue;

    const spots = [];
    let ok = true;
    for (let i = 0; i < balls * 2; i++) {
      const cand = home.filter(p => spots.every(q => Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) > 3));
      if (!cand.length) { ok = false; break; }
      spots.push(pick(cand));
    }
    if (!ok) continue;
    for (let i = 0; i < balls; i++) {
      g[spots[i][1]][spots[i][0]] = BALL_CH[i];
      g[spots[balls + i][1]][spots[balls + i][0]] = HOLE_CH[i];
    }

    const grid = g.map(r => r.join(''));
    if (!solvable(grid)) continue;
    return { name: '第 ' + n + ' 關', time: Math.max(14, Math.round(34 - n * 1.3)), grid };
  }
  // last resort: a known-good hand-authored room rather than a broken one
  return { name: '第 ' + n + ' 關', time: 30, grid: STORY_LEVELS[0].grid };
}

/** flood-fill id per open tile; -1 for walls */
function regionMap(g) {
  const rows = g.length, cols = g[0].length;
  const solid = (x, y) => x < 0 || y < 0 || x >= cols || y >= rows || g[y][x] === '#';
  const region = [];
  for (let y = 0; y < rows; y++) region.push(new Array(cols).fill(-1));
  let id = 0;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (solid(x, y) || region[y][x] >= 0) continue;
    const q = [[x, y]]; region[y][x] = id;
    while (q.length) {
      const [cx, cy] = q.pop();
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
        const nx = cx + dx, ny = cy + dy;
        if (!solid(nx, ny) && region[ny][nx] < 0) { region[ny][nx] = id; q.push([nx, ny]); }
      });
    }
    id++;
  }
  return region;
}

/** EVERY ball must be able to reach the hole of ITS OWN colour */
function solvable(grid) {
  const g = grid.map(r => r.split(''));
  const region = regionMap(g);
  const need = {};   // colour -> { ball: [regions], hole: Set(regions) }
  for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++) {
    const ch = g[y][x], id = region[y][x];
    const bc = BALL_COLOR[ch], hc = HOLE_COLOR[ch];
    if (bc) { (need[bc] = need[bc] || { ball: [], hole: new Set() }).ball.push(id); }
    if (hc) { (need[hc] = need[hc] || { ball: [], hole: new Set() }).hole.add(id); }
  }
  const colors = Object.keys(need);
  if (!colors.length) return false;
  return colors.every(c => {
    const e = need[c];
    return e.ball.length > 0 && e.hole.size > 0 && e.ball.every(r => e.hole.has(r));
  });
}

  const grid = def.grid.map(r => r.split(''));

  const balls = [], holes = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {

    if (BALL_COLOR[ch]) { balls.push(makeBall(x, y, BALL_COLOR[ch])); grid[y][x] = '.'; }

      holes.push({ x: x * TILE + TILE / 2, y: y * TILE + TILE / 2, gx: x, gy: y, color: HOLE_COLOR[ch] });

    def, grid, rows, cols, balls, holes,

    latched: false,
