<!DOCTYPE html>
<!--
  ============================================================================
  PROTOTYPE — 丟棄式。不要 import、不要 promote 到 index.html。
  ============================================================================

  問題：可進入的 2.5D 基地場景中，「角色行走 + 自由擺放建築」該用哪一種互動模型？

  三個變體，同一個場景，用 ?variant=A|B|C 切換（底部浮動列 / ← → 鍵）：
    A — 藍圖模式：你直接動手，角色不參與放置
    B — 全實體：角色是游標，什麼都得走過去
    C — 派工：你指，工程隊走過去蓋

  刻意不做的事（prototype 規則）：
    · 沒有存檔、沒有 AP、沒有章節、沒有存續狀態
    · 資源給滿（400/400），經濟不該擋住手感問題
    · 沒有測試、沒有錯誤處理、沒有抽象層
  ============================================================================
-->
<meta charset="utf-8">
<title>PROTOTYPE · 基地場景手感</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0a0512; color: #eafcff;
    font-family: ui-monospace, 'Cascadia Mono', 'Noto Sans TC', monospace;
  }
  #stage { position: relative; width: 100vw; height: 100vh; cursor: default; }
  canvas { display: block; width: 100%; height: 100%; }
  canvas.placing { cursor: crosshair; }

  /* 就地告示牌：協會格式的實體標示，不是對話框。跟著建築的投影座標走。 */
  #sign {
    position: absolute; display: none; transform: translate(-50%, -100%);
    min-width: 210px; padding: 9px 11px 10px;
    background: linear-gradient(180deg, #241a3a, #1a1229);
    border: 1px solid #5b4a86; border-top: 3px solid #ffd23f;
    box-shadow: 0 10px 22px rgba(0,0,0,.6);
    font-size: 12px; line-height: 1.5; pointer-events: auto;
  }
  #sign::after {
    content: ''; position: absolute; left: 50%; bottom: -9px; width: 2px; height: 9px;
    background: #5b4a86; transform: translateX(-50%);
  }
  #sign .sn { color: #ffd23f; font-weight: bold; letter-spacing: .05em; }
  #sign .slv { float: right; color: #3fe6e0; }
  #sign .sef { color: #b9a8dd; margin: 4px 0 8px; font-size: 11px; }
  #sign .srow { display: flex; gap: 5px; }
  #sign button {
    flex: 1; padding: 5px 4px; font: inherit; font-size: 11px; cursor: pointer;
    background: #32245a; color: #eafcff; border: 1px solid #5b4a86;
  }
  #sign button:hover:not(:disabled) { background: #46318a; }
  #sign button:disabled { opacity: .35; cursor: not-allowed; }

  /* 切換列 —— 刻意長得不像遊戲的一部分。丟棄式工具，不是設計的一部分。 */
  #switch {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; z-index: 50;
    background: #eafcff; color: #0a0512; border-radius: 999px;
    box-shadow: 0 6px 24px rgba(0,0,0,.7); padding: 4px; font-size: 12px;
  }
  #switch button {
    border: 0; background: transparent; font: inherit; font-weight: bold;
    cursor: pointer; padding: 6px 12px; border-radius: 999px; color: #0a0512;
  }
  #switch button:hover { background: #cddde4; }
  #switch .lbl { padding: 6px 14px; white-space: nowrap; }
  #switch .lbl b { letter-spacing: .1em; }
  #switch .hint { color: #4a5560; font-size: 11px; padding-right: 8px; }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="sign"></div>
</div>

<div id="switch">
  <button id="prev">◀</button>
  <div class="lbl"><b id="vk">A</b> — <span id="vn"></span></div>
  <button id="next">▶</button>
  <span class="hint" id="hint"></span>
</div>

<script>
/* ========================= 變體 ========================= */
const VARIANTS = {
  A: {
    name: '藍圖模式（你直接動手）',
    hint: '角色不參與放置。拿模型 → 點地。',
    rackNeedsAdjacent: false,   // 要不要走到工程車旁才拿得到模型
    walkToPlace: false,         // 放置前角色要不要走過去
    workerBuilds: false,        // 蓋房子的是工程隊還是憑空出現
    signNeedsAdjacent: false    // 看告示牌要不要走過去
  },
  B: {
    name: '全實體（角色是游標）',
    hint: '什麼都得走過去。慢，但你真的在那裡。',
    rackNeedsAdjacent: true, walkToPlace: true, workerBuilds: false, signNeedsAdjacent: true
  },
  C: {
    name: '派工（你指，工程隊去蓋）',
    hint: '立刻下樁，工程隊自己走過去施工。可連續下單。',
    rackNeedsAdjacent: false, walkToPlace: false, workerBuilds: true, signNeedsAdjacent: false
  }
};
const KEYS = Object.keys(VARIANTS);
let VK = (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase();
if (!VARIANTS[VK]) VK = 'A';
let V = VARIANTS[VK];

/* 就地切換，不重載：同一座基地、同一批建築，直接換互動模型。
   （也刻意不依賴 URL —— file:// 開啟時查詢字串未必留得住。） */
function gotoVariant(k) {
  VK = k; V = VARIANTS[k];
  player.carrying = null; pending = null; selected = null; player.path = [];
  workers.forEach(w => { w.job = null; w.path = []; });
  buildings.forEach(b => { if (!b.fixed) b.progress = 1; });
  renderSign(); paintSwitch();
  say(`切到變體 ${k} — ${V.name}`);
  try { history.replaceState(null, '', location.pathname + '?variant=' + k); } catch (e) { /* file:// 不給就算了 */ }
}
function paintSwitch() {
  document.getElementById('vk').textContent = VK;
  document.getElementById('vn').textContent = V.name;
  document.getElementById('hint').textContent = V.hint;
}
paintSwitch();
document.getElementById('prev').onclick = () => gotoVariant(KEYS[(KEYS.indexOf(VK) + KEYS.length - 1) % KEYS.length]);
document.getElementById('next').onclick = () => gotoVariant(KEYS[(KEYS.indexOf(VK) + 1) % KEYS.length]);
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') gotoVariant(KEYS[(KEYS.indexOf(VK) + KEYS.length - 1) % KEYS.length]);
  if (e.key === 'ArrowRight') gotoVariant(KEYS[(KEYS.indexOf(VK) + 1) % KEYS.length]);
  if (e.key === '1' || e.key === '2' || e.key === '3') gotoVariant(KEYS[+e.key - 1]);
});

/* ========================= 建築 =========================
   數值是佔位用的，等比例大概對就好；這個原型不驗證經濟。 */
const DEFS = {
  farm:       { n: '農地',   i: '🌱', cost: { s: 8,  p: 4 },  h: 6,  top: '#8fd96f', l: '#3f7d2f', r: '#2b5a20', eff: '種下作物，過幾天收成。' },
  teahouse:   { n: '茶水間', i: '🍵', cost: { s: 0,  p: 16 }, h: 26, top: '#6fd6c8', l: '#2f7d74', r: '#1f5a54', eff: '每日產物資　│　【喝一口茶】護盾 +2/級' },
  workshop:   { n: '工坊',   i: '🔧', cost: { s: 18, p: 0 },  h: 28, top: '#ffa552', l: '#a85a22', r: '#7a3f16', eff: '每日產零件　│　【敲擊桌面】傷害 +2/級' },
  meditation: { n: '冥想廳', i: '🧘', cost: { s: 22, p: 12 }, h: 30, top: '#c79bff', l: '#6b3fa8', r: '#4b2b78', eff: '戰鬥最大 HP +8/級' },
  lab:        { n: '研究所', i: '🔬', cost: { s: 0,  p: 0 },  h: 34, top: '#7fc4ff', l: '#2f6ea8', r: '#1f4d78', eff: '安置人才 · 每人 1 次 🔍 試探' },
  tower:      { n: '能源塔', i: '⚡', cost: { s: 70, p: 62 }, h: 54, top: '#ffd23f', l: '#a8801a', r: '#7a5c10', eff: '每回合起始能量 +1/級' },
  retrans:    { n: '重譯爐', i: '♨️', cost: { s: 26, p: 30 }, h: 32, top: '#ff8fa3', l: '#a83a55', r: '#78223a', eff: '把譯本再翻譯一次。愈譯愈遠，愈譯愈華麗。' }
};
const RACK = ['farm', 'teahouse', 'workshop', 'meditation', 'lab', 'tower', 'retrans'];

/* 場上不可動的既有物：實驗室載具停在基地中央，工程車與倉庫是常駐設施。 */
const FIXED = {
  labcar:  { n: '實驗室載具', i: '🚐', h: 30, top: '#8f8fb5', l: '#4a4a72', r: '#33334f' },
  truck:   { n: '協會工程車', i: '🚚', h: 24, top: '#ffd23f', l: '#8a6b12', r: '#5f4a0c' },
  storage: { n: '倉庫',       i: '📦', h: 22, top: '#c9b48a', l: '#7a6742', r: '#54462b' }
};

/* ========================= 狀態 ========================= */
const MOD = 6;                                    // 一塊地基模組 = 6×6
const owned = new Set(['0,0']);                   // 已擁有的模組
const MODULE_COST = { s: 40, p: 34 };

let res = { s: 400, p: 400 };                     // 給滿，別讓經濟擋住手感

const buildings = [                               // {key,gx,gy,lv,fixed,progress}
  { key: 'labcar',  gx: 2, gy: 3, fixed: true },
  { key: 'truck',   gx: 5, gy: 5, fixed: true },
  { key: 'storage', gx: 0, gy: 0, fixed: true }
];

const player = { gx: 2, gy: 5, path: [], dir: 'down', carrying: null };
const workers = [
  { gx: 4, gy: 1, path: [], dir: 'down', job: null, wait: 0, bubble: null },
  { gx: 1, gy: 2, path: [], dir: 'down', job: null, wait: 0, bubble: null }
];

let hoverTile = null;      // {gx,gy}
let selected = null;       // 目前開著告示牌的建築
let pending = null;        // B 變體：走到定位後要執行的事
let toast = null;          // 短暫的世界訊息（不是 UI，畫在場景裡）

/* ========================= 幾何 ========================= */
const TW = 64, TH = 32;
const cam = { x: 0, y: 0 };
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W = 0, H = 0;

function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

function iso(gx, gy) {
  return { x: (gx - gy) * TW / 2 - cam.x + W / 2, y: (gx + gy) * TH / 2 - cam.y + H / 2 };
}
function unIso(sx, sy) {
  const x = sx - W / 2 + cam.x, y = sy - H / 2 + cam.y;
  return { gx: (x / (TW / 2) + y / (TH / 2)) / 2, gy: (y / (TH / 2) - x / (TW / 2)) / 2 };
}
const K = (x, y) => x + ',' + y;
function modKey(x, y) { return Math.floor(x / MOD) + ',' + Math.floor(y / MOD); }
function isGround(x, y) { return owned.has(modKey(x, y)); }
function at(x, y) { return buildings.find(b => b.gx === x && b.gy === y) || null; }
function walkable(x, y) { return isGround(x, y) && !at(x, y); }

/* 已擁有模組的四鄰，就是可以拓展的地方。 */
function expandable() {
  const out = new Set();
  owned.forEach(k => {
    const [mx, my] = k.split(',').map(Number);
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
      const nk = (mx + dx) + ',' + (my + dy);
      if (!owned.has(nk)) out.add(nk);
    });
  });
  return [...out].map(k => { const [mx, my] = k.split(',').map(Number); return { mx, my, k }; });
}

/* ========================= 尋路 ========================= */
function path(from, to) {
  if (from.gx === to.gx && from.gy === to.gy) return [];
  const start = K(from.gx, from.gy), goal = K(to.gx, to.gy);
  const prev = new Map([[start, null]]);
  const q = [[from.gx, from.gy]];
  while (q.length) {
    const [x, y] = q.shift();
    if (K(x, y) === goal) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy, nk = K(nx, ny);
      if (prev.has(nk) || !walkable(nx, ny)) continue;
      prev.set(nk, K(x, y));
      q.push([nx, ny]);
    }
  }
  if (!prev.has(goal)) return null;
  const out = [];
  for (let k = goal; k && k !== start; k = prev.get(k)) {
    const [x, y] = k.split(',').map(Number);
    out.unshift({ gx: x, gy: y });
  }
  return out;
}
/* 走到「旁邊」而不是「上面」——放置與看告示牌都是站在隔壁做的事。 */
function pathAdjacent(from, tx, ty) {
  let best = null, bestLen = 1e9;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const nx = tx + dx, ny = ty + dy;
    if (!walkable(nx, ny)) continue;
    if (from.gx === nx && from.gy === ny) return [];
    const p = path(from, { gx: nx, gy: ny });
    if (p && p.length < bestLen) { bestLen = p.length; best = p; }
  }
  return best;
}
function adjacent(a, tx, ty) {
  return Math.abs(Math.round(a.gx) - tx) + Math.abs(Math.round(a.gy) - ty) <= 1;
}

/* ========================= 像素角色（沿用本篇既有的 sprite） ========================= */
const PLAYER_BASE = [
  '         ..         ', '        .hh.        ', '       .hGGh.       ',
  '      .hHGGHh.      ', '     .hHHHHHHh.     ', '    .hHHHHHHHHh.    ',
  '   .hHHHHHHHHHHh.   ', '   .hHHHHHHHHHHh.   ', '   .hHHHHHHHHHHh.   ',
  '   .hHddddddddHh.   ', '   .hHddddddddHh.   ', '   .hHddddddddHh.   ',
  '    .hddddddddh.    ', '    .hddddddddh.    ', '     .dddddddd.     ',
  '     .dddddddd.     ', '    .hHHHHHHHHh.    ', '   .hHHHHHHHHHHh.   ',
  ' .hHHHHHHHHHHHHHHh. ', '.hHHHHHHHHHHHHHHHHh.', '.hHHHHHHHHHHHHHHHHh.',
  '.hHHHHHHHHHHHHHHHHh.', '.hHHHHHHHHHHHHHHHHh.', '.hHHHHHHHHHHHHHHHHh.',
  'GGGGGGGGGGGGGGGGGGGG', '.hHHHHHHHHHHHHHHHHh.'
];
const PAL_PLAYER = { '.': '#0a0512', H: '#3a2266', h: '#241546', d: '#120a1f', G: '#ffd23f', g: '#6ff0e8', W: '#eafcff', P: '#1c1030' };
const PAL_WORKER = { '.': '#0a0512', H: '#7a3f16', h: '#5a2c10', d: '#2a1508', G: '#ffa552', g: '#ffd9a8', W: '#fff4e2', P: '#2a1508' };
const EYES = {
  neutral: ['  ....  ', ' .gggg. ', '.gWWWWg.', '.gWPPWg.', '.gWWWWg.', ' .gggg. ', '  ....  '],
  up:      ['  ....  ', ' .gggg. ', '.gWPPWg.', '.gWWWWg.', '.gWWWWg.', ' .gggg. ', '  ....  '],
  down:    ['  ....  ', ' .gggg. ', '.gWWWWg.', '.gWWWWg.', '.gWPPWg.', ' .gggg. ', '  ....  '],
  left:    ['  ....  ', ' .gggg. ', '.gWWWWg.', '.gPPWWg.', '.gWWWWg.', ' .gggg. ', '  ....  '],
  right:   ['  ....  ', ' .gggg. ', '.gWWWWg.', '.gWWPPg.', '.gWWWWg.', ' .gggg. ', '  ....  ']
};
const sprites = {};
function sprite(pal, dir, tag) {
  const key = tag + dir;
  if (sprites[key]) return sprites[key];
  const rows = PLAYER_BASE.map(r => r.split(''));
  const eye = EYES[dir] || EYES.neutral;
  for (let dy = 0; dy < eye.length; dy++)
    for (let dx = 0; dx < eye[dy].length; dx++)
      if (eye[dy][dx] !== ' ') rows[9 + dy][6 + dx] = eye[dy][dx];
  const cell = 2, cv = document.createElement('canvas');
  cv.width = 20 * cell; cv.height = 26 * cell;
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  rows.forEach((r, y) => r.forEach((ch, x) => {
    if (ch === ' ') return;
    g.fillStyle = pal[ch] || '#f0f'; g.fillRect(x * cell, y * cell, cell, cell);
  }));
  return (sprites[key] = cv);
}

/* ========================= 繪圖基元 ========================= */
function tile(x, y, top, side, lift) {
  const hw = TW / 2, hh = TH / 2, L = lift || 0;
  ctx.fillStyle = side;
  ctx.beginPath(); ctx.moveTo(x - hw, y - L); ctx.lineTo(x, y + hh - L); ctx.lineTo(x, y + hh); ctx.lineTo(x - hw, y); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + hw, y - L); ctx.lineTo(x, y + hh - L); ctx.lineTo(x, y + hh); ctx.lineTo(x + hw, y); ctx.fill();
  ctx.fillStyle = top;
  ctx.beginPath(); ctx.moveTo(x, y - hh - L); ctx.lineTo(x + hw, y - L); ctx.lineTo(x, y + hh - L); ctx.lineTo(x - hw, y - L); ctx.fill();
}
function box(x, y, w, d, h, top, l, r, alpha) {
  const hw = w / 2, hh = d / 2;
  if (alpha != null) ctx.globalAlpha = alpha;
  ctx.fillStyle = l;
  ctx.beginPath(); ctx.moveTo(x - hw, y - h); ctx.lineTo(x, y + hh - h); ctx.lineTo(x, y + hh); ctx.lineTo(x - hw, y); ctx.fill();
  ctx.fillStyle = r;
  ctx.beginPath(); ctx.moveTo(x + hw, y - h); ctx.lineTo(x, y + hh - h); ctx.lineTo(x, y + hh); ctx.lineTo(x + hw, y); ctx.fill();
  ctx.fillStyle = top;
  ctx.beginPath(); ctx.moveTo(x, y - hh - h); ctx.lineTo(x + hw, y - h); ctx.lineTo(x, y + hh - h); ctx.lineTo(x - hw, y - h); ctx.fill();
  ctx.globalAlpha = 1;
}
function diamond(x, y, stroke, dash) {
  ctx.strokeStyle = stroke; ctx.lineWidth = 2;
  ctx.setLineDash(dash || []);
  ctx.beginPath();
  ctx.moveTo(x, y - TH / 2); ctx.lineTo(x + TW / 2, y); ctx.lineTo(x, y + TH / 2); ctx.lineTo(x - TW / 2, y);
  ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
}
function bubble(x, y, text) {
  ctx.font = '12px ui-monospace, "Noto Sans TC", monospace';
  const w = Math.min(190, ctx.measureText(text).width + 16);
  const lines = wrap(text, 174), h = lines.length * 15 + 10;
  ctx.fillStyle = 'rgba(234,252,255,.94)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - w / 2, y - h, w, h, 6); else ctx.rect(x - w / 2, y - h, w, h);
  ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y); ctx.lineTo(x, y + 7); ctx.fill();
  ctx.fillStyle = '#150c22'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  lines.forEach((ln, i) => ctx.fillText(ln, x, y - h + 6 + i * 15));
}
function wrap(text, max) {
  const out = []; let cur = '';
  for (const ch of text) {
    if (ctx.measureText(cur + ch).width > max) { out.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}

/* ========================= 住民的嘴 =========================
   §5 的預覽：資訊由住民開口，不由橫幅或彈窗。三個池子。 */
const BUBBLES = {
  praise: ['他剛剛看了一眼西邊。西邊。', '大師連地基都放得這麼有道理。', '這個角度……他是在對齊什麼嗎？', '我把他打的哈欠寫進報告了。'],
  doom: ['再九天。你說我們來得及嗎。', '天邊那個顏色，昨天還不是那樣。', '我不怕。我只是在算距離。'],
  guide: ['研究所還空著一個位子。', '重譯爐冷了，沒人在用。', '第三塊地的茶樹明天就熟了。', '倉庫的零件快滿出來了。', '要拆要搬都不用錢，放心亂放。']
};
function speak(w) {
  const pool = Math.random() < .4 ? BUBBLES.guide : (Math.random() < .6 ? BUBBLES.praise : BUBBLES.doom);
  w.bubble = { t: pool[(Math.random() * pool.length) | 0], left: 3.4 };
}
function say(t) { toast = { t, left: 2.2 }; }

/* ========================= 動作 ========================= */
function afford(cost) { return res.s >= cost.s && res.p >= cost.p; }
function pay(cost) { res.s -= cost.s; res.p -= cost.p; }
function refund(cost) { res.s += cost.s; res.p += cost.p; }

function pickModel(key) {
  if (!afford(DEFS[key].cost)) { say('資源不夠，這個模型拿不動'); return; }
  player.carrying = key;
  selected = null;
  say(V.walkToPlace ? `拿起了${DEFS[key].n}的模型。找個地方放下。` : `${DEFS[key].n} — 點一塊空地放下`);
}

function place(gx, gy) {
  const key = player.carrying;
  if (!key || !walkable(gx, gy)) return;
  if (!afford(DEFS[key].cost)) { say('資源不夠'); player.carrying = null; return; }
  pay(DEFS[key].cost);
  const b = { key, gx, gy, lv: 1, progress: V.workerBuilds ? 0 : 1 };
  buildings.push(b);
  player.carrying = null;
  if (V.workerBuilds) say(`${DEFS[key].n} 已下樁。工程隊過去了。`);
}

function upgrade(b) {
  const cost = { s: Math.round(DEFS[b.key].cost.s * (b.lv + 1) * .8), p: Math.round(DEFS[b.key].cost.p * (b.lv + 1) * .8) };
  if (!afford(cost)) return;
  pay(cost); b.lv++;
  say(`${DEFS[b.key].n} 升級至 Lv${b.lv}`);
  renderSign();
}
/* 搬移與拆除永遠免費、全額退——規劃層要慷慨可反悔。 */
function relocate(b) {
  refund(DEFS[b.key].cost);
  buildings.splice(buildings.indexOf(b), 1);
  player.carrying = b.key;
  selected = null;
  say(`把${DEFS[b.key].n}抱起來了。放哪都行。`);
}
function demolish(b) {
  refund({ s: DEFS[b.key].cost.s * b.lv, p: DEFS[b.key].cost.p * b.lv });
  buildings.splice(buildings.indexOf(b), 1);
  selected = null;
  say(`${DEFS[b.key].n}拆了，資源全數退回。`);
}
function buyModule(m) {
  if (!afford(MODULE_COST)) { say('拓展地塊的資源不夠'); return; }
  pay(MODULE_COST); owned.add(m.k);
  say('地塊拓展完成。基地變大了。');
}

/* ========================= 點擊 ========================= */
c.addEventListener('mousemove', e => {
  const p = unIso(e.offsetX, e.offsetY);
  hoverTile = { gx: Math.round(p.gx), gy: Math.round(p.gy) };
  c.classList.toggle('placing', !!player.carrying);
});
c.addEventListener('click', e => {
  const p = unIso(e.offsetX, e.offsetY);
  const gx = Math.round(p.gx), gy = Math.round(p.gy);

  // 1. 工程車上的模型架
  const rackHit = rackHitTest(e.offsetX, e.offsetY);
  if (rackHit) {
    const truck = buildings.find(b => b.key === 'truck');
    if (V.rackNeedsAdjacent && !adjacent(player, truck.gx, truck.gy)) {
      const pa = pathAdjacent(player, truck.gx, truck.gy);
      if (pa) { player.path = pa; pending = { kind: 'rack', key: rackHit }; say('走過去拿模型……'); }
      return;
    }
    pickModel(rackHit);
    return;
  }

  // 2. 拓展地塊的樁
  const mod = expandable().find(m => m.mx === Math.floor(gx / MOD) && m.my === Math.floor(gy / MOD));
  if (mod && !isGround(gx, gy)) { buyModule(mod); return; }

  // 3. 手上有模型 → 放下
  if (player.carrying) {
    if (!walkable(gx, gy)) { say('那裡放不下'); return; }
    if (V.walkToPlace) {
      const pa = pathAdjacent(player, gx, gy);
      if (!pa) { say('走不過去'); return; }
      player.path = pa; pending = { kind: 'place', gx, gy };
    } else place(gx, gy);
    return;
  }

  // 4. 點建築 → 就地告示牌
  const b = at(gx, gy);
  if (b && !b.fixed) {
    if (V.signNeedsAdjacent && !adjacent(player, gx, gy)) {
      const pa = pathAdjacent(player, gx, gy);
      if (pa) { player.path = pa; pending = { kind: 'sign', b }; }
      return;
    }
    selected = b; renderSign(); return;
  }
  if (b && b.key === 'truck') {                 // 走到工程車旁
    const pa = pathAdjacent(player, gx, gy);
    if (pa) player.path = pa;
    return;
  }

  // 5. 空地 → 走過去
  selected = null; renderSign();
  if (walkable(gx, gy)) {
    const pa = path(player, { gx, gy });
    if (pa) player.path = pa;
  }
});

function onArrive() {
  if (!pending) return;
  const p = pending; pending = null;
  if (p.kind === 'rack') pickModel(p.key);
  if (p.kind === 'place') place(p.gx, p.gy);
  if (p.kind === 'sign') { selected = p.b; renderSign(); }
}

/* ========================= 告示牌（DOM，貼在世界座標上） ========================= */
const signEl = document.getElementById('sign');
function renderSign() {
  if (!selected) { signEl.style.display = 'none'; return; }
  const b = selected, d = DEFS[b.key];
  const cost = { s: Math.round(d.cost.s * (b.lv + 1) * .8), p: Math.round(d.cost.p * (b.lv + 1) * .8) };
  signEl.style.display = 'block';
  signEl.innerHTML =
    `<div><span class="sn">${d.i} ${d.n}</span><span class="slv">Lv ${b.lv}</span></div>
     <div class="sef">${d.eff}</div>
     <div class="srow">
       <button id="bUp" ${afford(cost) ? '' : 'disabled'}>升級　📦${cost.s} ⚙️${cost.p}</button>
     </div>
     <div class="srow" style="margin-top:5px">
       <button id="bMove">搬移（免費）</button>
       <button id="bDel">拆除（全退）</button>
     </div>`;
  signEl.querySelector('#bUp').onclick = () => upgrade(b);
  signEl.querySelector('#bMove').onclick = () => relocate(b);
  signEl.querySelector('#bDel').onclick = () => demolish(b);
}
function positionSign() {
  if (!selected) return;
  if (!buildings.includes(selected)) { selected = null; renderSign(); return; }
  const p = iso(selected.gx, selected.gy);
  signEl.style.left = p.x + 'px';
  signEl.style.top = (p.y - (DEFS[selected.key].h + selected.lv * 6) - 26) + 'px';
}

/* ========================= 模型架（畫在工程車旁的實體貨架） ========================= */
let rackBoxes = [];
function drawRack() {
  rackBoxes = [];
  const truck = buildings.find(b => b.key === 'truck');
  const p = iso(truck.gx, truck.gy);
  const near = adjacent(player, truck.gx, truck.gy);
  const live = !V.rackNeedsAdjacent || near;
  const x0 = p.x - (RACK.length * 44) / 2, y0 = p.y - 92;

  ctx.globalAlpha = live ? 1 : .42;
  ctx.fillStyle = '#1a1229';
  ctx.fillRect(x0 - 8, y0 - 20, RACK.length * 44 + 16, 62);
  ctx.strokeStyle = '#5b4a86'; ctx.lineWidth = 1;
  ctx.strokeRect(x0 - 8, y0 - 20, RACK.length * 44 + 16, 62);
  ctx.fillStyle = '#ffd23f'; ctx.font = '10px ui-monospace, monospace'; ctx.textAlign = 'left';
  ctx.fillText(live ? '協會工程車 · 模型架' : '協會工程車 · 走近才拿得到', x0 - 6, y0 - 8);

  RACK.forEach((k, i) => {
    const d = DEFS[k], bx = x0 + i * 44 + 22, by = y0 + 16;
    const ok = afford(d.cost);
    ctx.fillStyle = player.carrying === k ? '#46318a' : '#2b1f45';
    ctx.fillRect(bx - 20, by - 12, 40, 38);
    ctx.strokeStyle = ok ? '#5b4a86' : '#3a2f52';
    ctx.strokeRect(bx - 20, by - 12, 40, 38);
    ctx.globalAlpha = live ? (ok ? 1 : .35) : .3;
    ctx.font = '17px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.fillText(d.i, bx, by + 1);
    ctx.font = '9px ui-monospace, monospace'; ctx.fillStyle = '#b9a8dd';
    ctx.fillText(`${d.cost.s}/${d.cost.p}`, bx, by + 18);
    ctx.globalAlpha = live ? 1 : .42;
    if (live && ok) rackBoxes.push({ k, x: bx - 20, y: by - 12, w: 40, h: 38 });
  });
  ctx.globalAlpha = 1;
}
function rackHitTest(sx, sy) {
  const hit = rackBoxes.find(r => sx >= r.x && sx <= r.x + r.w && sy >= r.y && sy <= r.y + r.h);
  return hit ? hit.k : null;
}

/* ========================= 主迴圈 ========================= */
let last = performance.now();
function step(dt, a) {
  if (!a.path || !a.path.length) return false;
  const t = a.path[0];
  const dx = t.gx - a.gx, dy = t.gy - a.gy;
  const dist = Math.hypot(dx, dy), sp = 4.2 * dt;
  if (Math.abs(dx) > Math.abs(dy)) a.dir = dx > 0 ? 'right' : 'left';
  else if (dy !== 0) a.dir = dy > 0 ? 'down' : 'up';
  if (dist <= sp) { a.gx = t.gx; a.gy = t.gy; a.path.shift(); return a.path.length === 0; }
  a.gx += dx / dist * sp; a.gy += dy / dist * sp;
  return false;
}

function tickWorkers(dt) {
  workers.forEach(w => {
    if (w.bubble) { w.bubble.left -= dt; if (w.bubble.left <= 0) w.bubble = null; }
    else if (Math.random() < dt * 0.12) speak(w);

    if (V.workerBuilds && !w.job) {
      const job = buildings.find(b => !b.fixed && b.progress < 1 && !workers.some(o => o.job === b));
      if (job) {
        const pa = pathAdjacent(w, job.gx, job.gy);
        if (pa) { w.job = job; w.path = pa; }
      }
    }
    if (w.job) {
      if (w.path.length) { step(dt, w); return; }
      w.job.progress = Math.min(1, w.job.progress + dt / 2.2);
      if (w.job.progress >= 1) { w.job = null; }
      return;
    }
    // 閒晃
    if (w.path.length) { step(dt, w); return; }
    w.wait -= dt;
    if (w.wait <= 0) {
      w.wait = 1.5 + Math.random() * 3;
      const tries = [];
      for (let i = 0; i < 8; i++) {
        const nx = Math.round(w.gx) + ((Math.random() * 7) | 0) - 3;
        const ny = Math.round(w.gy) + ((Math.random() * 7) | 0) - 3;
        if (walkable(nx, ny)) tries.push({ gx: nx, gy: ny });
      }
      if (tries.length) { const p = path(w, tries[0]); if (p) w.path = p; }
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 天光
  const g = ctx.createRadialGradient(W / 2, H * .18, 20, W / 2, H * .18, Math.max(W, H) * .7);
  g.addColorStop(0, 'rgba(255,180,90,.16)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 地面
  const tiles = [];
  owned.forEach(k => {
    const [mx, my] = k.split(',').map(Number);
    for (let x = mx * MOD; x < mx * MOD + MOD; x++)
      for (let y = my * MOD; y < my * MOD + MOD; y++) tiles.push({ x, y });
  });
  tiles.sort((a, b) => (a.x + a.y) - (b.x + b.y));
  tiles.forEach(t => {
    const p = iso(t.x, t.y);
    if (p.x < -TW || p.x > W + TW || p.y < -TH * 4 || p.y > H + TH * 4) return;
    const edge = (t.x % MOD === 0 || t.y % MOD === 0);
    tile(p.x, p.y, edge ? '#31234f' : '#2b1f45', '#1b1330', 4);
  });

  // 可拓展的地塊：虛線的一整片，點一下就長出去
  expandable().forEach(m => {
    const cx = m.mx * MOD + MOD / 2 - .5, cy = m.my * MOD + MOD / 2 - .5;
    const p = iso(cx, cy);
    if (p.x < -400 || p.x > W + 400) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,210,63,.30)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    ctx.beginPath();
    const c0 = iso(m.mx * MOD - .5, m.my * MOD - .5);
    const c1 = iso(m.mx * MOD + MOD - .5, m.my * MOD - .5);
    const c2 = iso(m.mx * MOD + MOD - .5, m.my * MOD + MOD - .5);
    const c3 = iso(m.mx * MOD - .5, m.my * MOD + MOD - .5);
    ctx.moveTo(c0.x, c0.y); ctx.lineTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y); ctx.lineTo(c3.x, c3.y);
    ctx.closePath(); ctx.stroke(); ctx.restore();
    ctx.fillStyle = afford(MODULE_COST) ? '#ffd23f' : '#6b5f8a';
    ctx.font = '11px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('＋ 拓展地塊', p.x, p.y - 6);
    ctx.fillStyle = '#8f7fbf'; ctx.font = '10px ui-monospace, monospace';
    ctx.fillText(`📦${MODULE_COST.s} ⚙️${MODULE_COST.p}`, p.x, p.y + 9);
  });

  // 放置預覽
  if (player.carrying && hoverTile) {
    const ok = walkable(hoverTile.gx, hoverTile.gy);
    const p = iso(hoverTile.gx, hoverTile.gy);
    diamond(p.x, p.y - 4, ok ? '#3fe6e0' : '#ff4d6d', [5, 4]);
    if (ok) {
      const d = DEFS[player.carrying];
      box(p.x, p.y - 4, 42, 21, d.h, d.top, d.l, d.r, .38);
    }
  }

  // 深度排序：建築 + 角色一起排
  const ents = [];
  buildings.forEach(b => ents.push({ d: b.gx + b.gy, kind: 'b', b }));
  ents.push({ d: player.gx + player.gy + .35, kind: 'p', a: player, pal: PAL_PLAYER, tag: 'P' });
  workers.forEach(w => ents.push({ d: w.gx + w.gy + .35, kind: 'p', a: w, pal: PAL_WORKER, tag: 'W' }));
  ents.sort((a, b) => a.d - b.d);

  ents.forEach(e => {
    if (e.kind === 'b') {
      const b = e.b, d = b.fixed ? FIXED[b.key] : DEFS[b.key];
      const p = iso(b.gx, b.gy);
      const prog = b.fixed ? 1 : (b.progress != null ? b.progress : 1);
      const h = (d.h + (b.lv ? (b.lv - 1) * 7 : 0)) * (prog < 1 ? Math.max(.06, prog) : 1);
      const w = b.key === 'labcar' ? 56 : 42;
      if (prog < 1) diamond(p.x, p.y - 4, 'rgba(255,210,63,.7)', [4, 4]);
      box(p.x, p.y - 4, w, w * .5, h, d.top, d.l, d.r, prog < 1 ? .75 : 1);
      if (b.lv > 1) for (let i = 1; i < b.lv; i++) {
        ctx.fillStyle = 'rgba(0,0,0,.30)';
        ctx.fillRect(p.x - w / 2, p.y - 4 - h + i * (h / b.lv), w, 2);
      }
      ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(d.i, p.x, p.y - 4 - h - 10);
      if (!b.fixed) {
        ctx.font = 'bold 10px ui-monospace, monospace'; ctx.fillStyle = '#ffd23f';
        ctx.fillText(prog < 1 ? '施工中' : 'Lv' + b.lv, p.x, p.y + 11);
      }
      if (b.key === 'storage') {
        ctx.font = 'bold 11px ui-monospace, monospace'; ctx.fillStyle = '#ffd23f';
        ctx.fillText(`📦${res.s}`, p.x, p.y - 4 - h - 42);
        ctx.fillText(`⚙️${res.p}`, p.x, p.y - 4 - h - 28);
      }
    } else {
      const a = e.a, p = iso(a.gx, a.gy);
      const s = sprite(e.pal, a.dir, e.tag);
      ctx.drawImage(s, p.x - s.width / 2, p.y - s.height + 8);
      // 手上抱著的模型
      if (a === player && player.carrying) {
        const d = DEFS[player.carrying];
        box(p.x + 13, p.y - 26, 18, 9, 13, d.top, d.l, d.r);
      }
      if (a.bubble) bubble(p.x, p.y - s.height + 2, a.bubble.t);
    }
  });

  drawRack();

  if (toast) {
    ctx.fillStyle = 'rgba(10,5,18,.82)';
    ctx.font = '13px ui-monospace, "Noto Sans TC", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(toast.t).width + 26;
    ctx.fillRect(W / 2 - w / 2, 22, w, 30);
    ctx.strokeStyle = '#5b4a86'; ctx.lineWidth = 1; ctx.strokeRect(W / 2 - w / 2, 22, w, 30);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(toast.t, W / 2, 38);
  }
}

function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (step(dt, player)) onArrive();
  tickWorkers(dt);
  if (!V.workerBuilds) buildings.forEach(b => { if (!b.fixed && b.progress < 1) b.progress = 1; });
  if (toast) { toast.left -= dt; if (toast.left <= 0) toast = null; }

  // 相機：跟著玩家，慢慢的
  const tp = { x: (player.gx - player.gy) * TW / 2, y: (player.gx + player.gy) * TH / 2 };
  cam.x += (tp.x - cam.x) * Math.min(1, dt * 3);
  cam.y += (tp.y - cam.y) * Math.min(1, dt * 3);

  draw();
  positionSign();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
